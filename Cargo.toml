[package]
name = "file_search"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
calamine = "0.36.1"
cfb = "0.15.0"
chardetng = "1.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
ctrlc = "3.5.2"
dirs = "7.0.0"
encoding_rs = "0.8.42"
globset = "0.4.20"
indicatif = "0.18.6"
notify = "8.2.0"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
rayon = "1.12.0"
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tantivy = "0.26.2"
tiny_http = "0.12.0"
walkdir = "2.5.0"
zip = "8.6.0"

[lib]
name = "file_search"
path = "src/lib.rs"

[[bin]]
name = "fsearch"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[dev-dependencies]
tempfile = "3.27.0"
# panic = "unwind" (по умолчанию) нужен: повреждённые файлы разбираются под catch_unwind
