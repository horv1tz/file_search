[package]
name = "file_search"
version = "0.1.8"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/horv1tz/file_search"
readme = "README.md"
description = "Полнотекстовый поиск по файлам: имена и содержимое (Word, Excel, PowerPoint, PDF, текст)"

[dependencies]
anyhow = "1.0.104"
calamine = "0.36.1"
cfb = "0.15.0"
chardetng = "1.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
ctrlc = "3.5.2"
dirs = "7.0.0"
eframe = { version = "0.33.3", features = ["wgpu", "persistence"], optional = true }
pollster = { version = "0.4", optional = true }
egui = { version = "0.33.3", default-features = false, optional = true }
encoding_rs = "0.8.42"
globset = "0.4.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"], optional = true }
indicatif = "0.18.6"
notify = "8.2.0"
lopdf = "0.42"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
rayon = "1.12.0"
rfd = { version = "0.17.2", optional = true }
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
# Отрисовка страниц PDF в картинку (для распознавания текста на сканах). Чистый Rust, без внешних библиотек;
# шрифты для отрисовки не встраиваем: на сканах текст — это картинка.
hayro = { version = "0.8", default-features = false }
# Собственное распознавание текста: модели PaddleOCR запускает rten (чистый Rust, без C-библиотек и DLL).
rten = "=0.27.0"
rten-tensor = "=0.27.0"
tantivy = "0.26.2"
tiny_http = "0.12.0"
walkdir = "2.5.0"
zip = "8.6.0"

[lib]
name = "file_search"
path = "src/lib.rs"

[[bin]]
name = "fsearch"
path = "src/main.rs"

[[bin]]
name = "fsearch-gui"
path = "src/bin/fsearch-gui/main.rs"
required-features = ["gui"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
# panic = "unwind" (по умолчанию) нужен: повреждённые файлы разбираются под catch_unwind

# Вычисления нейросети в неоптимизированной сборке (cargo test) шли бы минутами: ядро расчётов оптимизируем всегда.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-onnx]
opt-level = 3
[profile.dev.package.rten-parallel]
opt-level = 3
[profile.dev.package.rten-shape-inference]
opt-level = 3

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Проверка обновлений. На Windows и macOS шифрование берётся у системы (SChannel / Security.framework): ни лишних
# библиотек в exe, ни корневых сертификатов, которые устаревают. На остальных системах — rustls.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "3.4", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3.27.0"
# В проверках PDF с настоящим текстом отрисовывается в картинку, а для этого нужны встроенные шрифты.
hayro = { version = "0.8", default-features = false, features = ["embed-fonts"] }

[features]
default = ["gui"]
# Графическое приложение fsearch-gui (окно на egui). Без него собираются только библиотека и консольный fsearch.
gui = ["dep:eframe", "dep:egui", "dep:rfd", "dep:image", "dep:pollster"]

[build-dependencies]
winresource = "0.1.31"
