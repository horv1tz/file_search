name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rustflags: ""
          # Статическая C-библиотека: exe из артефактов запускается без «Microsoft Visual C++ Redistributable».
          - os: windows-latest
            rustflags: "-C target-feature=+crt-static"
          - os: macos-latest
            rustflags: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Модели распознавания текста (13 МБ) встраиваются в exe; в репозитории их нет.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Модели распознавания
        run: python scripts/fetch_ocr_models.py
      - name: Test
        run: cargo test --release
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Build
        run: cargo build --release
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: fsearch-${{ matrix.os }}
          path: |
            target/release/fsearch
            target/release/fsearch.exe
            target/release/fsearch-gui
            target/release/fsearch-gui.exe
          if-no-files-found: ignore
